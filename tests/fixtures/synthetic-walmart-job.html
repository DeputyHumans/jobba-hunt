<!doctype html>
<!-- Synthetic Walmart careers job page, modelled on careers.walmart.com/us/en/jobs/R-<id> (a public page).
     Several responsive panes carry the same "Apply now" button; only one shows at a given width. -->
<html><head><title>(USA) Principal, Software Engineer - Walmart Careers</title></head>
<body>
<header><form role="search"><input type="search" aria-label="Search for jobs" placeholder="Search for jobs"><button type="submit" aria-label="Search">Go</button></form></header>
<main>
  <div data-id="JobDetailsHeader" data-testid="JobDetailsHeader" style="display:none">
    <button type="button" class="ld-button-primary" aria-label="Apply now" data-id="job-apply-button"><span>Apply now</span><span><i aria-hidden="true">+</i></span></button>
  </div>
  <div data-id="JobDetailsTopBannerSection-pane-desktop-middlePane">
    <h1>(USA) Principal, Software Engineer</h1>
    <div>100 Main St, Springfield, IL 62701</div>
    <button type="button" class="ld-button-primary" aria-label="Apply now" data-id="job-apply-button"><span>Apply now</span><span><i aria-hidden="true">+</i></span></button>
  </div>
  <section><h2>Role summary</h2><p>The Principal Software Engineer leads the design and delivery of scalable platform capabilities.</p></section>
</main>
<div data-id="JobDetailsFooter" data-testid="JobDetailsFooter" style="display:none"><button type="button" aria-label="Apply now" data-id="job-apply-button">Apply now</button></div>
</body></html>
