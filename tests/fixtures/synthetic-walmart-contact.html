<!doctype html>
<!-- Synthetic Walmart careers contact page (/us/en/jobs/contact-details), modelled on its Next.js bundle
     (pages/[country]/[lang]/jobs/contact-details): an email box, the site terms box (label text, then a Read
     more button inside the label), Continue (aria-label only, no test id) disabled until the box is ticked. -->
<html><head><title>Contact details - Walmart Careers</title></head>
<body>
<header><form role="search"><input type="search" aria-label="Search for jobs"><button type="submit" aria-label="Search">Go</button></form></header>
<div class="relative flex flex-col items-center w-full">
  <div class="w-full flex flex-col items-start bg-white relative">
    <div class="flex flex-col items-start p-0 gap-8"><h1>Let us know how to contact you</h1></div>
    <form class="flex flex-col w-full">
      <div class="flex flex-col items-start gap-2 w-full">
        <label for="email"><div>Email address</div></label>
        <input id="email" type="text" aria-label="Email address" aria-required="true" autocomplete="email" value="" data-testid="email-input">
        <p id="email-helper-text">Avoid using an email address you share with others</p>
      </div>
      <div>
        <div>
          <label class="ld_AW" for="mvk-info-r3-input">
            <input type="checkbox" class="ld_Aa" id="mvk-info-r3-input" data-testid="checkbox-mvk-info-r3">
            <div class="ld_Ab"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></div>
            <span class="ld_Ad">I understand and accept the Website Terms &amp; Conditions and Privacy Policy available on our website as well as the Terms and Conditions. <button type="button">Read more</button></span>
          </label>
        </div>
      </div>
      <div class="hidden tablet:flex gap-6 w-full mt-6"><button type="submit" aria-label="Continue" disabled>Continue</button></div>
    </form>
  </div>
</div>
</body></html>
