<!doctype html>
<!-- Workday "Review" (synthetic, modelled on Workday tenant markup): the saved pages read back, and
     the footer's Submit, which a dry run never presses. No personal values. -->
<html><head><meta charset="utf-8"><title>workday fixture</title></head><body>
<div data-automation-id="applyFlowPage">
<div aria-label="Application Progress"><ol data-automation-id="progressBar"><li data-automation-id="progressBarInactiveStep"><label>step 1 of 7</label><label>Create Account/Sign In</label></li><li data-automation-id="progressBarInactiveStep"><label>step 2 of 7</label><label>My Information</label></li><li data-automation-id="progressBarInactiveStep"><label>step 3 of 7</label><label>My Experience</label></li><li data-automation-id="progressBarInactiveStep"><label>step 4 of 7</label><label>Application Questions</label></li><li data-automation-id="progressBarInactiveStep"><label>step 5 of 7</label><label>Voluntary Disclosures</label></li><li data-automation-id="progressBarInactiveStep"><label>step 6 of 7</label><label>Self Identify</label></li><li data-automation-id="progressBarActiveStep"><label aria-live="polite">current step 7 of 7</label><label>Review</label></li></ol></div>
<div data-automation-id="applyFlowReviewPage"><h2>Review</h2>
  <h3>My Information</h3><div><label>How Did You Hear About Us?</label><div>LinkedIn</div></div>
  <h3>My Experience</h3><div><label>Resume/CV</label><div>resume.pdf</div></div>
</div>
<div data-automation-id="pageFooter"><button type="button" data-automation-id="pageFooterBackButton">Back</button><button type="button" data-automation-id="pageFooterNextButton">Submit</button></div>
</div>
</body></html>
