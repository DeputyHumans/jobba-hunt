<!doctype html><html><body>
<div id="app"><h1>Fractional CTO at Acme</h1>
<form id="application-form">
 <label for="first_name">First Name*</label><input id="first_name" aria-required="true">
 <label for="last_name">Last Name*</label><input id="last_name" aria-required="true">
 <label for="em">Email*</label><input id="em" type="email" aria-required="true">
 <label for="resume">Resume/CV*</label><input id="resume" type="file" aria-required="true" style="display:none">
 <label for="li">LinkedIn Profile</label><input id="li">
 <label for="cl">Cover Letter</label><textarea id="cl"></textarea>
 <label for="g">Gender</label><select id="g"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline To Self Identify</option></select>
 <label for="v">Veteran Status</label><select id="v"><option value="">Select...</option><option>I am a veteran</option><option>I am not a protected veteran</option><option>I don't wish to answer</option></select>
 <button type="submit">Submit application</button>
</form>
<iframe src="about:blank#https://www.google.com/recaptcha/api2/anchor?k=x&size=invisible"></iframe>
</div></body></html>
