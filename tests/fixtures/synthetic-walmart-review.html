<!doctype html>
<!-- Synthetic Walmart careers review page (questionnaire type INPUT_REVIEW), modelled on its bundle:
     sections About you, Work experience and Voluntary, each with an Edit button, then the page actions.
     The primary action here is the one that submits. -->
<html><head><title>Apply - Walmart Careers</title></head>
<body>
<main class="flex flex-col w-full">
  <div class="relative">
    <nav aria-label="Progress"><div><span>Review</span> <span>Step 4 of 4</span></div></nav>
    <form aria-labelledby="questionnaire-title">
      <div role="region" aria-labelledby="questionnaire-title"><div id="questionnaire-title" class="sr-only" aria-hidden="true">Review</div><h2>Review</h2></div>
      <div style="gap:64px">
        <div><div><span>About you</span><button type="button">Edit</button></div><div><div>Email<div>ab****@example.com</div></div></div></div>
        <div><div><span>Work experience</span><button type="button">Edit</button></div><div>Principal Engineer</div></div>
        <div><div><span>Voluntary</span><button type="button">Edit</button></div><div>I don't wish to answer</div></div>
      </div>
      <div class="flex flex-row-reverse justify-start gap-4 pt-8"><button type="button" class="ld_p ld_r ld_w">Submit</button><button type="button" class="ld_p ld_s ld_w">Back</button></div>
    </form>
  </div>
</main>
</body></html>
