<!doctype html>
<!-- Synthetic job-boards.greenhouse.io 2026 layout: react-select comboboxes, each followed by an aria-hidden required
     shadow input, and file uploads whose own <label for> says "Attach" while the group heading
     names the slot. No real data. -->
<html><head><meta charset="utf-8"><title>Apply</title>
<style>
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .requiredInput { opacity: 0; pointer-events: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; }
  .field-wrapper { position: relative; margin: 12px 0; }
  input { width: 300px; height: 24px; }
</style></head>
<body>
<form id="application-form">
  <div class="field-wrapper">
    <label id="first_name-label" for="first_name">First Name<span aria-hidden="true">*</span></label>
    <input id="first_name" aria-label="First Name" aria-required="true" type="text">
  </div>
  <div class="field-wrapper">
    <label id="email-label" for="email">Email<span aria-hidden="true">*</span></label>
    <input id="email" aria-label="Email" aria-required="true" type="text">
  </div>
  <div class="field-wrapper"><div class="select"><div class="select__container">
    <label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span></label>
    <div class="select-shell"><div><div class="select__control"><div class="select__value-container">
      <input class="select__input" id="country" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="country-label" aria-required="true" value="">
    </div></div></div></div>
    <input required tabindex="-1" aria-hidden="true" class="requiredInput" value="">
  </div></div></div>
  <div class="field-wrapper">
    <label id="phone-label" for="phone">Phone<span aria-hidden="true">*</span></label>
    <input id="phone" aria-label="Phone" aria-required="true" type="tel">
  </div>
  <div class="field-wrapper"><div class="select"><div class="select__container">
    <label id="candidate-location-label" for="candidate-location" class="label select__label">Location (City)<span aria-hidden="true">*</span></label>
    <div class="select-shell"><div><div class="select__control"><div class="select__value-container">
      <input class="select__input" id="candidate-location" type="text" role="combobox" aria-autocomplete="list" aria-labelledby="candidate-location-label" aria-required="true" value="">
    </div></div></div></div>
    <input required tabindex="-1" aria-hidden="true" class="requiredInput" value="">
  </div></div></div>
  <div class="field-wrapper">
    <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
      <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
      <div class="button-container"><div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="resume">Attach</label><input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div>
        <button type="button">Dropbox</button><button type="button">Enter manually</button></div>
    </div>
  </div>
  <div class="field-wrapper">
    <div role="group" aria-labelledby="upload-label-cover_letter" class="file-upload">
      <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
      <div class="button-container"><div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label><input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div>
        <button type="button">Dropbox</button><button type="button">Enter manually</button></div>
    </div>
  </div>
  <div class="field-wrapper"><div class="select"><div class="select__container">
    <label id="q1-label" for="q1" class="label select__label">Are you legally eligible for employment in the United States?<span aria-hidden="true">*</span></label>
    <div class="select-shell"><div><div class="select__control"><div class="select__value-container">
      <input class="select__input" id="q1" type="text" role="combobox" aria-autocomplete="list" aria-labelledby="q1-label" aria-required="true" value="">
    </div></div></div></div>
    <input required tabindex="-1" aria-hidden="true" class="requiredInput" value="">
  </div></div></div>
  <div class="field-wrapper"><div class="select"><div class="select__container">
    <label id="q2-label" for="q2" class="label select__label">Will you now or in the future require Acme, Inc. to file a petition or application for employment - based status on your behalf?<span aria-hidden="true">*</span></label>
    <div class="select-shell"><div><div class="select__control"><div class="select__value-container">
      <input class="select__input" id="q2" type="text" role="combobox" aria-autocomplete="list" aria-labelledby="q2-label" aria-required="true" value="">
    </div></div></div></div>
    <input required tabindex="-1" aria-hidden="true" class="requiredInput" value="">
  </div></div></div>
  <div class="field-wrapper">
    <label id="q3-label" for="q3">LinkedIn Profile</label>
    <input id="q3" aria-label="LinkedIn Profile" type="text">
  </div>
  <button type="submit">Submit application</button>
</form>
</body></html>
